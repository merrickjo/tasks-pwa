name = "tasks-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# BUG-06: locked to the live GitHub Pages origin. CORS was never the real
# gate (the app key is), but leaving it at the "*" default was hygiene debt.
[vars]
ALLOWED_ORIGIN = "https://merrickjo.github.io"

# Secrets are NOT set here — run these once from the worker/ folder:
#   wrangler secret put APP_KEY

[[d1_databases]]
binding = "DB"
database_name = "tasks-db"
database_id = "d26f766f-db8c-47e3-9bb4-f5aeeb593173"
